{% extends "base.html" %}
{% block title %}Admin — Modifier un film{% endblock %}
{% block content %}
<div class="admin-badge">⚙ Mode administrateur</div>
<div class="breadcrumb">
    <a href="/admin-panel/">Admin</a>
    <span class="sep">›</span>
    <a href="/admin-panel/films/">Films</a>
    <span class="sep">›</span>
    <span class="current">Modifier</span>
</div>
<h1 class="page-title">Modifier : {{ film.titre }}</h1>
<div class="title-accent"></div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="titre">Titre du film</label>
            <input type="text" name="titre" id="titre" value="{{ film.titre }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" required>{{ film.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="categorie">Catégorie</label>
            <select name="categorie" id="categorie" required>
                {% for cat in categories %}
                <option value="{{ cat }}" {% if film.categorie == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Technologies de projection</label>
            <div class="checkbox-group">
                {% for tech in technologies %}
                <div class="checkbox-item">
                    <input type="checkbox" name="technologies" value="{{ tech.id }}" id="tech_{{ tech.id }}"
                        {% if tech in film.technologies.all %}checked{% endif %}>
                    <label for="tech_{{ tech.id }}">{{ tech.nom }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div style="display:flex; gap:1rem; margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">💾 Sauvegarder</button>
            <a href="/admin-panel/films/" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
