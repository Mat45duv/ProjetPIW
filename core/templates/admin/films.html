{% extends "base.html" %}

{% block content %}
<h2>Films</h2>

<a href="/admin-panel/films/add/">Ajouter un film</a>

<hr>

{% for film in films %}
    <p>
        {{ film.titre }}
        | <a href="/admin-panel/films/edit/{{ film.id }}">Modifier</a>
        | <a href="/admin-panel/films/delete/{{ film.id }}">Supprimer</a>
    </p>
{% endfor %}

{% endblock %}
