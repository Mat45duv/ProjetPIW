{% extends "base.html" %}
{% block title %}Admin — Modifier une salle{% endblock %}
{% block content %}
<div class="admin-badge">⚙ Mode administrateur</div>
<div class="breadcrumb">
    <a href="/admin-panel/">Admin</a>
    <span class="sep">›</span>
    <a href="/admin-panel/salles/">Salles</a>
    <span class="sep">›</span>
    <span class="current">Modifier</span>
</div>
<h1 class="page-title">Modifier : {{ salle.nom }}</h1>
<div class="title-accent"></div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="nom">Nom de la salle</label>
            <input type="text" name="nom" id="nom" value="{{ salle.nom }}" required>
        </div>
        <div class="form-group">
            <label for="nombre_places">Nombre de places</label>
            <input type="number" name="nombre_places" id="nombre_places" value="{{ salle.nombre_places }}" min="1" required>
        </div>
        <div class="form-group">
            <label>Technologies disponibles</label>
            <div class="checkbox-group">
                {% for tech in technologies %}
                <div class="checkbox-item">
                    <input type="checkbox" name="technologies" value="{{ tech.id }}" id="tech_{{ tech.id }}"
                        {% if tech in salle.technologies.all %}checked{% endif %}>
                    <label for="tech_{{ tech.id }}">{{ tech.nom }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div style="display:flex; gap:1rem; margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">💾 Sauvegarder</button>
            <a href="/admin-panel/salles/" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
